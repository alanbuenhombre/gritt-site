<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>María &amp; Tomás — Comparte tus fotos</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Ballet&display=swap" rel="stylesheet">
<style>
  :root{--bg:#141009;--card:#1e1810;--cream:#EAE0CC;--gold:#C9A96A;--muted:#8a7d63;--line:rgba(201,169,106,.18)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}
  .top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg),rgba(20,16,9,.85));backdrop-filter:blur(8px);padding:18px 18px 14px;text-align:center;border-bottom:1px solid var(--line)}
  .mono{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1;color:var(--cream);display:inline-flex;align-items:center;margin-bottom:4px}
  .mono .amp{font-family:'Ballet',cursive;font-weight:400;color:var(--gold);margin:0 .02em}
  .couple{font-family:'Cormorant Garamond',serif;font-size:1.05rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
  .sub{font-size:.74rem;color:var(--muted);margin-top:3px}
  .count{font-size:.72rem;color:var(--gold);margin-top:8px;letter-spacing:.08em}
  .count b{font-weight:700}
  .grid{columns:2;column-gap:8px;padding:12px 12px 130px}
  .ph{break-inside:avoid;margin-bottom:8px;border-radius:10px;overflow:hidden;background:var(--card);position:relative;opacity:0;transform:translateY(14px) scale(.98);animation:pop .6s cubic-bezier(.22,1,.36,1) forwards}
  .ph img{width:100%;display:block}
  .ph .who{position:absolute;left:8px;bottom:7px;font-size:.66rem;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:99px;backdrop-filter:blur(3px)}
  @keyframes pop{to{opacity:1;transform:none}}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(20,16,9,0),var(--bg) 30%)}
  .name{width:100%;background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:10px;font-family:inherit}
  .name::placeholder{color:var(--muted)}
  .share{width:100%;background:linear-gradient(120deg,#d8b878,#C9A96A);color:#241a08;border:0;border-radius:14px;padding:16px;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 10px 30px rgba(201,169,106,.28)}
  .share:active{transform:scale(.98)}
  .prog{position:fixed;left:0;top:0;height:3px;width:0;background:var(--gold);z-index:40;transition:width .2s ease;box-shadow:0 0 8px var(--gold)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#20361f;color:#dfeee0;border:1px solid rgba(212,255,61,.3);border-radius:99px;padding:10px 20px;font-size:.85rem;font-weight:600;display:flex;gap:8px;align-items:center;opacity:0;transition:.4s;z-index:40;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tag{position:fixed;top:10px;right:10px;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:4px 9px;border-radius:99px;z-index:30}
</style>
</head>
<body>
  <span class="tag">Prototipo</span>
  <div class="prog" id="prog"></div>
  <header class="top">
    <div class="mono" role="img" aria-label="María y Tomás">M<span class="amp">&amp;</span>T</div>
    <div class="couple">María &nbsp;✕&nbsp; Tomás</div>
    <div class="sub">Comparte tus fotos de la noche</div>
    <div class="count"><b id="count">0</b> fotos compartidas</div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="bar">
    <input class="name" id="name" type="text" placeholder="Tu nombre (opcional)" maxlength="24">
    <button class="share" id="share">📷 Compartir foto</button>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </div>
  <div class="toast" id="toast">✓ ¡Foto compartida!</div>

<script>
  const pool=['../opt/bodas-01.jpg','../opt/bodas-02.jpg','../opt/bodas-03.jpg','../opt/bodas-04.jpg','../opt/bodas-05.jpg','../opt/bodas-06.jpg','../opt/bodas-07.jpg','../opt/bodas-08.jpg','../opt/bodas-09.jpg','../opt/compromiso.jpg','../opt/boda.jpg','../opt/ceremonia.jpg'];
  const names=['Laura','Andrés','Sofía','Camila','Daniel','','Valentina','','Mateo','Juanita'];
  const grid=document.getElementById('grid'), countEl=document.getElementById('count');
  let count=0;
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('mt-fotos') : null;

  function addPhoto(src, who, broadcast=true){
    const fig=document.createElement('figure'); fig.className='ph';
    fig.innerHTML='<img src="'+src+'" alt="">'+(who?'<span class="who">'+who+'</span>':'');
    grid.prepend(fig);
    count++; countEl.textContent=count;
    if(broadcast && bc) bc.postMessage({src,who});
  }
  // Semilla inicial (últimas fotos ya subidas)
  for(let i=0;i<10;i++) addPhoto(pool[i%pool.length], names[i%names.length], false);

  function simulateUpload(src){
    const prog=document.getElementById('prog'); prog.style.width='0';
    let p=0; const t=setInterval(()=>{p+=Math.random()*22; prog.style.width=Math.min(p,100)+'%';
      if(p>=100){clearInterval(t);
        const who=document.getElementById('name').value.trim();
        addPhoto(src, who);
        window.scrollTo({top:0,behavior:'smooth'});
        const toast=document.getElementById('toast'); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1800);
        setTimeout(()=>prog.style.width='0',300);
      }
    },110);
  }
  document.getElementById('share').onclick=()=>document.getElementById('file').click();
  document.getElementById('file').onchange=e=>{
    const f=e.target.files[0];
    const src = f ? URL.createObjectURL(f) : pool[Math.floor(Math.random()*pool.length)];
    simulateUpload(src); e.target.value='';
  };
</script>
  <script data-goatcounter="https://gritt.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
