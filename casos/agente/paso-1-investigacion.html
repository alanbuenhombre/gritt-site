<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flujo neural · test</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1D1D1B; --lime:#D4FF3D; --ink:#E8E8E4; --muted:#A6A6A2;
    --card:rgba(255,255,255,.045); --card-2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06); --r:14px;
    --ease:cubic-bezier(.22,.61,.24,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:'Manrope',system-ui,sans-serif}
  .fit{transform-origin:center center}
  .stage{width:1280px;height:800px;background:var(--bg);position:relative;overflow:hidden;color:var(--ink)}
  .stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px, transparent 1px);background-size:26px 26px;opacity:.055}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 45%,transparent 60%,var(--bg))}

  .top{position:absolute;top:26px;left:34px;right:34px;display:flex;align-items:center;gap:12px;z-index:6}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;color:var(--lime);font-weight:800;font-size:16px}
  .crumb{color:var(--muted);font-size:14px}.crumb b{color:var(--ink);font-weight:700}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);font-weight:700}
  .live .d{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:blip 1.2s ease-in-out infinite}

  svg.wires{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
  .wire{fill:none;stroke:rgba(212,255,61,.45);stroke-width:1.1;stroke-linecap:round;
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .55s var(--ease)}
  .wire.draw{stroke-dashoffset:0}
  .flowp{fill:var(--lime);opacity:0}

  .node{position:absolute;z-index:3;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r);width:186px;
    background:var(--card);border:1px solid var(--line-soft);backdrop-filter:blur(6px);box-shadow:0 12px 30px rgba(0,0,0,.32);
    transform:translateY(-50%) scale(.92);opacity:0;transition:opacity .4s var(--ease), transform .4s var(--ease)}
  .node.on{opacity:1;transform:translateY(-50%) scale(1)}
  .node .ic{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.06)}
  .node .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .node .t{font-size:13px;font-weight:700;line-height:1.15}.node .k{font-size:10.5px;color:var(--muted);margin-top:1px}
  .node.done .ic{color:var(--lime)}
  .node.done{border-color:rgba(212,255,61,.28)}
  .node .chk{position:absolute;right:-6px;top:-6px;width:15px;height:15px;border-radius:50%;background:var(--lime);border:2px solid var(--bg);
    display:grid;place-items:center}
  .node .chk svg{width:9px;height:9px;fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

  /* Brief (front) — grande */
  .brief{width:200px;border-color:rgba(212,255,61,.35);background:rgba(212,255,61,.04)}
  .brief .ic{color:var(--lime);background:rgba(212,255,61,.12)}
  /* Resultado (right) — bullet */
  .result{width:210px}
  .result .ic{color:var(--lime)}

  .foot{position:absolute;left:34px;bottom:26px;z-index:6;font-size:12.5px;color:var(--muted);font-family:ui-monospace,monospace;display:flex;align-items:center;gap:9px}
  .foot .d{width:7px;height:7px;border-radius:50%;background:var(--lime);animation:blip 1.2s ease-in-out infinite}
  .foot2{position:absolute;right:34px;bottom:26px;z-index:6;font-size:12px;color:var(--muted)}.foot2 b{color:var(--lime)}

  @keyframes blip{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.6}}
  .zoom{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
  .fade{position:absolute;inset:0;background:#000;z-index:20;opacity:1;pointer-events:none;transition:opacity .55s ease}
  .cursor{position:absolute;z-index:16;left:0;top:0;opacity:0;transition:opacity .3s ease,left .9s cubic-bezier(.34,.02,.2,1),top .9s cubic-bezier(.34,.02,.2,1)}
  .cursor svg{display:block;width:26px;height:26px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
  .cursor.press svg{transform:scale(.82)}
  .ring{position:absolute;z-index:15;width:14px;height:14px;border:2px solid var(--lime);border-radius:50%;opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
  .ring.go{animation:ring .55s ease-out}
  @keyframes ring{0%{opacity:.85;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}
  .rise{opacity:0;transform:translate(-8px,0);animation:rise .7s var(--ease) forwards}
  @keyframes rise{to{opacity:1;transform:translate(0,0)}}
  .node.rise{animation:riseN .7s var(--ease) forwards}
  @keyframes riseN{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){.zoom{animation:none}.rise,.node.rise{animation:none;opacity:1;transform:translateY(-50%)}.live .d,.foot .d{animation:none}}
</style>
</head>
<body>
<div class="fit" id="fit">
  <div class="stage">
    <div class="zoom">
      <div class="top rise" style="animation-delay:.05s">
        <div class="logo">G</div><div class="crumb"><b>Gritt</b> · Sprint de marca — Blackrack</div>
        <button id="restart" style="margin-left:auto;display:flex;align-items:center;gap:7px;font-family:'Manrope';font-size:12px;font-weight:700;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>Reiniciar</button>
        <span class="live" style="margin-left:14px"><span class="d"></span>a-gent trabajando</span>
      </div>
      <svg class="wires" id="wires"></svg>
      <div id="nodes"></div>
      <div class="ring" id="ring"></div>
      <div class="cursor" id="cursor"><svg viewBox="0 0 24 24"><path d="M4 2l6 16 2.5-6.5L19 9 4 2z" fill="#fff" stroke="#1D1D1B" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
      <div class="foot rise" style="animation-delay:.9s"><span class="d"></span><span>a-gent conecta el brief con cada etapa…</span></div>
      <div class="foot2 rise" style="animation-delay:.9s"><b>a-gent</b> prepara · el ojo humano afina.</div>
    </div>
    <div class="fade" id="fade"></div>
  </div>
</div>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit(){var f=document.getElementById('fit');var s=Math.min(innerWidth/1280,innerHeight/800);f.style.transform='scale('+s+')';}
  addEventListener('resize',fit); fit();

  var NW=186, RW=210, BW=200;
  // Brief al frente (izq, centrado vertical). Etapas en abanico (arriba/abajo). Resultado a la derecha.
  var brief={id:'brief',t:'Brief recibido',k:'entrada',ic:'flag',x:56,y:400,w:BW,cls:'brief'};
  var stages=[
    {id:'prop',t:'Propósito & Visión',k:'Momento 01',ic:'target',x:540,y:130},
    {id:'val', t:'Valores & Personalidad',k:'Momento 02',ic:'diamond',x:540,y:290},
    {id:'pos', t:'Posicionamiento',k:'Momento 03',ic:'crosshair',x:540,y:450},
    {id:'idn', t:'Identidad · Matriz',k:'Momento 05',ic:'grid',x:540,y:610},
  ];
  var result={id:'deck',t:'Deck vivo',k:'sistema · salida',ic:'deck',x:1010,y:400,w:RW,cls:'result'};
  var IC={
    flag:'<path d="M5 21V4M5 4h11l-2.5 3.5L16 11H5"/>',
    target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
    diamond:'<path d="M12 3 21 12 12 21 3 12z"/>',
    crosshair:'<circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
    grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    deck:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/>'
  };
  var nodesEl=document.getElementById('nodes'), wiresEl=document.getElementById('wires');
  var all=[brief].concat(stages,[result]);
  var byId={}, elNode={}; all.forEach(function(n){byId[n.id]=n;n._w=n.w||NW;});
  var parts=[], timers=[];
  var wait=function(ms){return new Promise(function(r){timers.push(setTimeout(r,ms));});};

  function makeNode(n){
    var d=document.createElement('div'); d.className='node'+(n.cls?' '+n.cls:'')+(n.id!=='brief'?' done':'');
    d.style.left=n.x+'px'; d.style.top=n.y+'px'; d.style.width=n._w+'px';
    var chk=(n.id!=='brief')?'<div class="chk"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-11"/></svg></div>':'';
    d.innerHTML='<div class="ic"><svg viewBox="0 0 24 24">'+IC[n.ic]+'</svg></div><div><div class="t">'+n.t+'</div><div class="k">'+n.k+'</div></div>'+chk;
    nodesEl.appendChild(d); elNode[n.id]=d; return d;
  }
  function makeWire(A,B,litOff){
    var ax=A.x+A._w-4, ay=A.y, bx=B.x+4, by=B.y;              // entra 4px dentro de cada card
    var dx=Math.max(70,(bx-ax)*0.5);
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','wire');
    p.setAttribute('d','M '+ax+' '+ay+' C '+(ax+dx)+' '+ay+', '+(bx-dx)+' '+by+', '+bx+' '+by);
    wiresEl.appendChild(p);
    p.style.setProperty('--len', p.getTotalLength());
    var ps=[]; for(var k=0;k<2;k++){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','1.8');c.setAttribute('class','flowp');wiresEl.appendChild(c);var o={c:c,path:p,off:k/2+litOff};ps.push(o);parts.push(o);}
    return {p:p,ps:ps};
  }

  var zoom=document.querySelector('.zoom'), fadeEl=document.getElementById('fade');
  var cursor=document.getElementById('cursor'), ring=document.getElementById('ring');
  var briefC={x:brief.x+brief._w/2, y:brief.y}, deckC={x:result.x+result._w/2, y:result.y};

  // Cámara: enfoca (cx,cy) a cierta escala. transform-origin 0 0; centro escenario = 640,400
  function cam(scale,cx,cy,ms,ease){
    zoom.style.transition='transform '+ms+'ms '+(ease||'cubic-bezier(.4,0,.2,1)');
    zoom.style.transform='translate('+(640-cx*scale)+'px,'+(400-cy*scale)+'px) scale('+scale+')';
  }
  function setCursor(x,y,ms){ cursor.style.transition='opacity .3s ease,left '+ms+'ms cubic-bezier(.34,.02,.2,1),top '+ms+'ms cubic-bezier(.34,.02,.2,1)'; cursor.style.left=x+'px'; cursor.style.top=y+'px'; }

  function build(){
    nodesEl.innerHTML=''; wiresEl.innerHTML=''; parts=[];
    all.forEach(makeNode);
    var wires={};
    stages.forEach(function(s,i){wires['b>'+s.id]=makeWire(brief,s,i*0.15);});
    stages.forEach(function(s,i){wires[s.id+'>d']=makeWire(s,result,0.3+i*0.13);});
    return wires;
  }

  async function run(){
    timers.forEach(clearTimeout); timers=[];
    var wires=build();

    if(reduce){
      fadeEl.style.opacity=0; zoom.style.transform='none';
      all.forEach(function(n){elNode[n.id].classList.add('on');});
      Object.values(wires).forEach(function(w){w.p.classList.add('draw');w.ps.forEach(function(o){o.on=true;});});
      return;
    }

    // — Estado inicial: negro, cámara con zoom sobre el Brief, cursor oculto —
    fadeEl.style.transition='none'; fadeEl.style.opacity=1;
    cursor.style.opacity=0; cursor.classList.remove('press');
    cam(1.9, briefC.x, briefC.y, 0);
    await wait(60);

    // 1) Fade in y aparece el Brief (zoom cerrado, detalle)
    fadeEl.style.transition='opacity .55s ease'; fadeEl.style.opacity=0;
    await wait(300); elNode.brief.classList.add('on');
    await wait(650);

    // 2) Zoom-out a vista completa MIENTRAS el agente construye el flujo
    cam(1, 640, 400, 2200, 'cubic-bezier(.5,0,.15,1)');
    for(var i=0;i<stages.length;i++){
      var s=stages[i], w=wires['b>'+s.id];
      w.p.classList.add('draw');
      await wait(300);
      elNode[s.id].classList.add('on');
      w.ps.forEach(function(o){o.on=true;});
      await wait(190);
    }
    await wait(200);
    // 3) líneas de cada etapa al Deck vivo
    for(var j=0;j<stages.length;j++){
      var s2=stages[j], w2=wires[s2.id+'>d'];
      w2.p.classList.add('draw');
      if(j===0){ await wait(280); elNode.deck.classList.add('on'); }
      w2.ps.forEach(function(o){o.on=true;});
      await wait(360);
    }

    // 4) Hold: el sistema completo, un par de segundos
    await wait(2000);

    // 5) Zoom-in al Deck vivo (final) + entra el cursor y hace clic
    cam(1.75, deckC.x, deckC.y, 1300, 'cubic-bezier(.4,0,.2,1)');
    cursor.style.opacity=0; setCursor(deckC.x+150, deckC.y+140, 0);
    await wait(300);
    cursor.style.opacity=1; setCursor(deckC.x+22, deckC.y+16, 950);
    await wait(1050);
    // clic
    cursor.classList.add('press');
    ring.style.left=(deckC.x+8)+'px'; ring.style.top=(deckC.y+10)+'px';
    ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
    elNode.deck.style.transition='transform .18s ease'; elNode.deck.style.transform='translateY(-50%) scale(1.06)';
    await wait(180); cursor.classList.remove('press'); elNode.deck.style.transform='translateY(-50%) scale(1)';
    await wait(550);

    // 6) Fade a negro y reinicia el loop
    fadeEl.style.transition='opacity .55s ease'; fadeEl.style.opacity=1;
    await wait(650);
    run();
  }
  run();
  document.getElementById('restart').onclick=run;

  if(!reduce){
    function loop(ts){var t=ts/1000;parts.forEach(function(pp){if(!pp.on){pp.c.style.opacity=0;return;}var L=pp.path.getTotalLength();var u=((t*0.26+pp.off)%1);var pt=pp.path.getPointAtLength(u*L);pp.c.setAttribute('cx',pt.x);pp.c.setAttribute('cy',pt.y);var e=Math.min(u,1-u);pp.c.style.opacity=(0.08+Math.min(1,e*6)*0.82);});requestAnimationFrame(loop);}
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
