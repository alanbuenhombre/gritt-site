<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gritt — Estudio</title>
<meta name="description" content="Ayudamos a marcas ambiciosas a convertir ideas audaces en experiencias inolvidables.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080807; --ink:#F5F4F1; --muted:rgba(245,244,241,.72); --line:rgba(245,244,241,.22);
    --lime:#C6F24E; --sans:'Archivo',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:inherit;text-decoration:none}

  .frame{position:fixed;inset:14px;border:1px solid var(--line);border-radius:26px;overflow:hidden}

  /* Carrusel de clips de fondo */
  .stage{position:absolute;inset:0;z-index:0;background:#000}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .slide.active{opacity:1}
  .slide img,.slide video{width:100%;height:100%;object-fit:cover;filter:grayscale(.35) contrast(1.05) brightness(.9)}
  .slide.ken.active img{animation:ken 7s ease-out forwards}
  @keyframes ken{from{transform:scale(1.14)}to{transform:scale(1)}}
  /* Slide del logo (inicio) */
  .slide.logo{background:#000;display:flex;align-items:center;justify-content:center}
  .slide.logo .mk{font-weight:800;font-size:clamp(3rem,9vw,7rem);letter-spacing:-.02em;color:#fff;opacity:.9}
  .slide.logo .mk span{color:var(--lime)}
  .stage::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 30% 20%,rgba(8,8,7,.35),rgba(8,8,7,.72));z-index:2}

  .content{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;padding:30px 40px 40px}
  @media(max-width:600px){.frame{inset:8px;border-radius:18px}.content{padding:20px 22px 26px}}

  /* Nav pill */
  .nav{display:flex;align-items:center;justify-content:center;position:relative}
  .navpill{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:999px;padding:12px 26px;backdrop-filter:blur(6px);background:rgba(255,255,255,.03)}
  .navpill a{font-size:.82rem;font-weight:500;letter-spacing:.01em;color:var(--ink);opacity:.9}
  .navpill a:hover{opacity:1;color:var(--lime)}
  .navpill .sep{width:22px;height:1px;background:var(--line)}
  .astk{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:1.6rem;color:var(--ink)}
  @media(max-width:760px){.navpill .sep{display:none}.navpill{gap:12px;padding:10px 18px}.navpill a{font-size:.72rem}.astk{display:none}}

  /* Intro + CTA */
  .intro{margin-top:40px;max-width:44ch}
  .intro p{font-size:clamp(.95rem,1.5vw,1.12rem);line-height:1.5;color:var(--ink)}
  .intro .cta{margin-top:26px;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:13px 24px;font-size:.9rem;font-weight:600;transition:background .25s,color .25s}
  .intro .cta:hover{background:var(--lime);color:#0b1004;border-color:var(--lime)}

  /* Wordmark + arrow (abajo) */
  .bottom{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .wordmark{font-weight:800;font-size:clamp(4rem,17vw,13rem);line-height:.82;letter-spacing:-.03em}
  .arrow{flex:none;width:74px;height:74px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:background .25s,color .25s}
  .arrow:hover{background:var(--ink);color:#0b0b0a}
  .arrow svg{width:22px;height:22px}
  @media(max-width:600px){.arrow{width:56px;height:56px}}

  .reveal{opacity:0;transform:translateY(16px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}
  .reveal.in{opacity:1;transform:none}
</style>
</head>
<body>
  <div class="frame">

    <!-- Carrusel de clips (placeholder) -->
    <div class="stage" id="stage">
      <div class="slide logo active"><div class="mk">Gritt<span>.</span></div></div>
      <div class="slide"><video muted loop playsinline preload="metadata"><source src="../videos/0_Dark_Shadow_1280x720.mp4" type="video/mp4"></video></div>
      <div class="slide"><video muted loop playsinline preload="metadata"><source src="../videos/0_Boxing_Fighter_1280x720.mp4" type="video/mp4"></video></div>
      <div class="slide"><video muted loop playsinline preload="metadata"><source src="../videos/0_Boxing_Exercise_1280x720.mp4" type="video/mp4"></video></div>
      <div class="slide"><video muted loop playsinline preload="metadata"><source src="../videos/0_Arrow_Up_1280x720.mp4" type="video/mp4"></video></div>
    </div>

    <!-- Contenido -->
    <div class="content">
      <nav class="nav">
        <div class="navpill">
          <a href="#">Estudio</a><span class="sep"></span>
          <a href="#">Servicios</a><span class="sep"></span>
          <a href="#">Trabajo</a><span class="sep"></span>
          <a href="#">Insights</a><span class="sep"></span>
          <a href="#">Contacto</a>
        </div>
        <div class="astk">✳</div>
      </nav>

      <div class="intro reveal">
        <p>Ayudamos a marcas ambiciosas a convertir ideas audaces en experiencias inolvidables. Con estrategia, diseño e IA, creamos marcas y contenido que capturan atención y hacen crecer.</p>
        <a class="cta" href="https://wa.me/573002112871?text=Hola%20Gritt%2C%20quiero%20empezar%20un%20proyecto" target="_blank" rel="noopener">Empieza tu proyecto →</a>
      </div>

      <div class="bottom">
        <div class="wordmark reveal">GRITT</div>
        <a class="arrow reveal" href="#" aria-label="Bajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
      </div>
    </div>

  </div>

  <script>
    // Carrusel: arranca con el logo, luego clips uno tras otro (loop)
    (function(){
      var slides=[].slice.call(document.querySelectorAll('.stage .slide'));
      var i=0;
      var DUR=[2400,5200,5200,5200,5200]; // logo más corto, clips ~5.2s
      function next(){
        slides[i].classList.remove('active');
        i=(i+1)%slides.length;
        slides[i].classList.add('active');
        slides.forEach(function(s){ var vv=s.querySelector('video'); if(vv && s!==slides[i]){ vv.pause(); } });
        var v=slides[i].querySelector('video'); if(v){ try{v.currentTime=0;v.play();}catch(e){} }
        setTimeout(next, DUR[i]||5000);
      }
      setTimeout(next, DUR[0]);
    })();
    // Reveals
    setTimeout(function(){ document.querySelectorAll('.reveal').forEach(function(e,i){ setTimeout(function(){e.classList.add('in');}, 300+i*140); }); }, 200);
  </script>
  <script data-goatcounter="https://gritt.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
